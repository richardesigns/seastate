name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Fetch API data
        env:
          PRIVATE_API_KEY: ${{ secrets.PRIVATE_API_KEY }}
        run: node fetch-data.mjs

      - name: Save JSON back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add api-data.json

          if git diff --cached --quiet; then
            echo "API data has not changed."
          else
            git commit -m "Update API data"
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Update page timestamp
        env:
          TZ: Europe/London
        run: |
          timestamp=$(date '+%d %B %Y at %H:%M:%S %Z')
          sed -i "s|__LAST_UPDATED__|$timestamp|g" index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

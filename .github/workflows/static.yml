name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  schedule:
    - cron: "0 3 * * *"
      timezone: "Europe/London"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Fetch weather and marine data
        run: node fetch-data.mjs

      - name: Generate beach images
        id: images
        continue-on-error: true
        env:
          PRIVATE_API_KEY: ${{ secrets.PRIVATE_API_KEY }}
        run: node generate-beach-images.mjs

      - name: Save forecasts and images to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add api-data.json
          if [ -f beach-images.json ]; then git add beach-images.json; fi
          if [ -d images ]; then git add -- images; fi

          if git diff --cached --quiet; then
            echo "No saved data has changed."
          else
            git commit -m "Update beach forecasts and images"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Update page timestamp
        env:
          TZ: Europe/London
        run: |
          timestamp=$(date '+%d %B %Y at %H:%M:%S %Z')
          sed -i "s|__LAST_UPDATED__|$timestamp|g" index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Report an incomplete image run
        if: ${{ steps.images.outcome == 'failure' }}
        run: |
          echo "Image generation was incomplete. Saved progress and forecasts have been published. Rerun the workflow to resume."
          exit 1
